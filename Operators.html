<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript Operators</title>
</head>
<body>
    <h3 id="demo"></h3>
    <h3 id="demo1"></h3>
    <h3 id="demo2"></h3>
    <p id="demo3"></p>
    <p id="demo4"></p>
    <p id="demo5"></p>
    <script>
        let x = 10
        document.getElementById("demo").innerHTML= x;

        let a = 10;
        let b = 20;
        let z = a + b;
        document.getElementById("demo1").innerHTML = "This is sum a + b is "+ z;
        let c = 5;
        let d = 6;
        let e = c * d
        document.getElementById("demo2").innerHTML = "The total calculator is " + e;
        let f = 10;
        let g = (20 + 30) * f;
        document.getElementById("demo3").innerHTML = "The total number is " + g;
        let text1 = "Jone "
        text1 += "doe"
        document.getElementById("demo4").innerHTML = "The fully new text is " + text1;
        //JavaScript Comparison Operators
        var h = 8
        document.getElementById("demo5").innerHTML = "This is come true or false " + (h > 6);
    </script>
</body>
</html>
