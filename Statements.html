<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript Statments</title>
</head>
<body>
    <h2 id="demo"></h2>
    <script>
        let x, y, z;
        x = 5
        y = 7
        z = x + y
        document.getElementById("demo").innerHTML = "This is values of z " + z;
    </script>
    <p>JavaScript statements are separated by semicolons.</p>
    <h3 id="demo1"></h3>
    <script>
        let a, b, c;
        a = 12;
        b = 15;
        c = a + b;
        document.getElementById("demo1").innerHTML = "The sum calculator " + c;
    </script>
    
</body>
</html>
