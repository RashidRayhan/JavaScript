<!DOCTYPE html>
<html>
<header>
<title>This is JavaScript Mock Test — 01 If / Else / Conditions</title>
</header>
<body>
<p id="demo"></p>
<p id="demo1"></p>
<p id="demo2"></p>
<p id="demo3"></p>
<p id="demo4"></p>
<p id="demo5"></p>
<p id="demo6"></p>
<p id="demo7"></p>
<p id="demo8"></p>
<p id="demo9"></p>
<p id="demo10"></p>
<p id="demo11"></p>
<p id="demo12"></p>
<p id="demo13"></p>
<p id="demo14"></p>
<p id="demo15"></p>
<p id="demo16"></p>
<script>
//A JavaScript string is zero or more characters written inside quotes.
let text = "Hello world";
let txt = 'I love javascript';
let age = "25"; //age is string because is come in quotes
document.getElementById("demo").innerHTML = "My first javascript striing is " + text+". "+ txt + ". I am " + age + "years old";

//You can use quotes inside a string, as long as they don't match the quotes surrounding the string:
let answer = "It's allright now";
let answer1 = "Hello, Mr 'Rashid'";
let answer2 = 'I am Mr "Rayhan"';
document.getElementById("demo1").innerHTML = answer+ "<br>" + answer1+ "<br>" + answer2;


//To find the length of a string, use the built-in length property:
let txt_ab = "abcdefghijklmnopqrstuvwxyz";
document.getElementById("demo2").innerHTML = txt_ab.length;

//String Templates
//Template Strings allow both single and double quotes inside a string:
let name = `Hello, I am "Rashid"`;
document.getElementById("demo3").innerHTML = name;

//Variable Substitutions:
let firstname = "Jhon";
let lastname = "Dhoe"
let texts = `we are ${firstname}, ${lastname}`;
document.getElementById("demo4").innerHTML = texts;

//Template Strings allow interpolation of expressions in strings:
let price = 10;
let vat = 0.25;
let total = `Total is : ${(price * (1+ vat)).toFixed(2)}`;
document.getElementById("demo5").innerHTML = total;

//HTML Templates
let header = "Template Strings";
let tags = ["template strings", "javascript", "es6"];

let html = `<h2>${header}</h2><ul>`;
for(const x of tags) {
    html +=`<li>${x}</li>`;
}
html += `</ul>`;
document.getElementById("demo6").innerHTML = html;

//String Methods
//String Length
let txt1 = "abcedefghijklmnopqrstuvwxyz";
document.getElementById("demo7").innerHTML = txt1.length;

//String charAt()
let txt2 = "hello World";
document.getElementById("demo8").innerHTML = txt2.charAt(4);

// String charCodeAt()
let txt3 = "Hello World";
document.getElementById("demo9").innerHTML = txt3.charCodeAt(0);

//codePointAt()
let txt4 = "Hello World";
document.getElementById("demo10").innerHTML = txt4.codePointAt(1);
//String at()
let txt5 = "World";
document.getElementById("demo11").innerHTML = txt5.at(0);

let txt6 = "W3schools";
document.getElementById("demo12").innerHTML = txt6.at(-2);

//String concat()
let txt7 = "hello";
let txt8 = "World";
let txt9 = txt7.concat(" ", txt8);
document.getElementById("demo13").innerHTML = txt9;

//String slice()
let txt10 = "Apple, Banana, Kiwi";
document.getElementById("demo14").innerHTML = txt10.slice(7, 13);

let fruit = "Apple, Banana, Cherry, Kiwi";
let part = fruit.slice(7);
document.getElementById("demo15").innerHTML = part; //substring(), substr() are work same

//Converting to Upper and Lower Case
let text11 = "hello world";
document.getElementById("demo16").innerHTML = txt11.toUpperCase;


</script>
</body>
</html>
