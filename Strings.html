<body>
<p id="demo"></p>

<script>
//A JavaScript string is zero or more characters written inside quotes.
let text = "Hello world";
let txt = 'I love javascript';
let age = "25"; //age is string because is come in quotes
document.getElementById("demo").innerHTML = "My first javascript striing is " + text+". "+ txt + ". I am " + age + "years old";

//You can use quotes inside a string, as long as they don't match the quotes surrounding the string:
let answer = "It's allright now";
let answer1 = "Hello, Mr 'Rashid'";
let answer2 = 'I am Mr "Rayhan"';
document.getElementById("demo1").innerHTML = answer+ "<br>" + answer1+ "<br>" + answer2;


//To find the length of a string, use the built-in length property:
let txt_ab = "abcdefghijklmnopqrstuvwxyz";
document.getElementById("demo2").innerHTML = txt_ab.length;

//String Templates
//Template Strings allow both single and double quotes inside a string:
let name = `Hello, I am "Rashid"`;
document.getElementById("demo3").innerHTML = name;

//Variable Substitutions:
let firstname = "Jhon";
let lastname = "Dhoe"
let texts = `we are ${firstname}, ${lastname}`;
document.getElementById("demo4").innerHTML = texts;

//Template Strings allow interpolation of expressions in strings:
let price = 10;
let vat = 0.25;
let total = `Total is : ${(price * (1+ vat)).toFixed(2)}`;
document.getElementById("demo5").innerHTML = total;

//HTML Templates
let header = "Template Strings";
let tags = ["template strings", "javascript", "es6"];

let html = `<h2>${header}</h2><ul>`;
for(const x of tags) {
    html +=`<li>${x}</li>`;
}
html += `</ul>`;
document.getElementById("demo6").innerHTML = html;





</script>
</body>
</html>
