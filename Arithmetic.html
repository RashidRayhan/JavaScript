<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript Arithmetic</title>
</head>
<body>
    <h4 id="demo"></h4>
    <h4 id="demo1"></h4>
    <h4 id="demo2"></h4>
    <h4 id="demo3"></h4>
    <h4 id="demo4"></h4>
    <h4 id="demo5"></h4>
    <script>
        let a = 15 + 5;
        document.getElementById("demo").innerHTML = a;
        let b = 50;
        let c = 100;
        let d = b + c;
        document.getElementById("demo1").innerHTML = d;
        var e = 50;
        var f = 20;
        var g = e - f;
        document.getElementById("demo2").innerHTML = g;
        const h = 15;
        const i = 10;
        const j = h * i
        document.getElementById("demo3").innerHTML = j;
        let k = 30;
        let l = 2;
        let m = k % l;
        document.getElementById("demo4").innerHTML = m;
        var n = 25;
        var o = 5;
        var p = n / o;
        document.getElementById("demo5").innerHTML = p;
    </script>
</body>
</html>
