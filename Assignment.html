<body>
<div class="continer">
    <p id="demo"></p>
    <p id="demo1"></p>
    <p id="demo2"></p>

    <p id="demo17"></p>
</div>

    <script>
        //Simple Assignment Examples
        let x = 10;
        document.getElementById("demo").innerHTML = "The x value is"+ x;
        let y = 40;
        let z = 10 + y;
        document.getElementById("demo1").innerHTML = "The x + y value is " + z;

        //The += Operator
        var a = 30;
        a += 10;
        document.getElementById("demo2").innerHTML = "The new a += value is " + a;

        //The -= Operator
        var b = 20;
        b -= 10;
        document.getElementById("demo3").innerHTML = "The subs is work b-= " + b;
        //The *= Operator
        var c = 10;
        c *= 3;
        document.getElementById("demo4").innerHTML = "The mutli work is " + c;
        //The **= Operator
        var d = 20;
        d **= 2;
        document.getElementById("demo5").innerHTML = "The total result is " + d;

        //The /= Operator
        let e = 100;
        e /= 20;
        document.getElementById("demo6").innerHTML = "The total result for '/' " + e;

        //The %= Operator
        let f = 10;
        f %= 5;
        document.getElementById("demo7").innerHTML = "The % result is " + f;

        //The = Operator
        let text = "hello World"
        document.getElementById("demo8").innerHTML = text;

        //The += Operator
        let txt = "hello ";
        txt += "world";
        document.getElementById("demo9").innerHTML = txt;

        //The &&= Operator
        let txt1 = true;
        let txt2 = txt1 &&= 10;
        document.getElementById("demo10").innerHTML = txt2;
        //false
        let txt3 = false;
        let txt4 = txt3 &&= 10;
        document.getElementById("demo11").innerHTML = txt4;
        //undefined
        //let txt5 = undefined;
        //txt6 = text5 &&= 10;
        //document.getElementById("demo12").innerHTML = txt6;
        //The Spread (...) Operator
        let texts = "123456";
        let min = Math.min(...texts);
        let max = Math.max(...texts);
        document.getElementById("demo13").innerHTML = "The min number is: " + min + "<br> The max number is: " + max;
    </script>
