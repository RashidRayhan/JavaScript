<!DOCTYPE html>
<html>
    <header>
        <title>
            Javascript Comparison Headline
        </title>
    </header>
<body>
    <p id="demo"></p>
    <p id="demo1"></p>
    <p id="demo2"></p>
    <p id="demo3"></p>
    <p id="demo4"></p>
    <p id="demo5"></p>
    <p id="demo6"></p>
    <script>
        //JavaScript String Comparison
        let txt1 = "A";
        let txt2 = "B";
        let result = txt1 < txt2;
        document.getElementById("demo").innerHTML = "A is greater B " + result;

        //Javascript Number comparison
        let txt3 = 12;
        let txt4 = 14;
        let results = txt3 < txt4;
        document.getElementById("demo1").innerHTML = "Text is 14 is greater then 12 " + results;

        
    </script>
</body>
</html>
